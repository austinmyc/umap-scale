# Output-dimension check of the v3 grow rule (n_components = 10), real data only.
# Held-out 1M+ test on a GPU server. Prepare each dataset as PCA-50 .npy arrays first:
#   python -m umapscale.data prepare-h5ad <file.h5ad> data/mouse_brain --label-key <cell_type_column>
#   python -m umapscale.data prepare-embeddings <features.npy> data/imagenet_clip
# kNN on GPU (FAISS), layout on CPU cores (umap-learn). For n >= 1M an extra 1000-epoch run checks
# that 500 epochs is a valid reference. Budget grid and target follow PREDICTIONS_v2.md (E95_best).
output: results/raw/large_m10.jsonl
datasets:
  - {name: "npy:data/mouse_brain_X.npy,data/mouse_brain_y.npy", sizes: [100000, 300000], extra_budgets: [1000]}
  - {name: "npy:data/imagenet_clip_X.npy,data/imagenet_clip_y.npy", sizes: [100000, 300000], extra_budgets: [1000]}
n_components: 10
optimizers: [adam]   # add compatibility for the legacy laws if time allows
budgets: [5, 10, 15, 25, 35, 50, 70, 100, 140, 200, 300, 500]
seeds: [42, 7, 123]
knn_backend: faiss-gpu
knn_accuracy: true
parallel: true   # use all CPU cores for the layout (no fixed random_state)
grow: {stages: [25, 25, 50, 100, 200], rho: 0.3, tau: 0.03}   # frozen v3 grow rule (PREDICTIONS_v3.md), one run per seed
