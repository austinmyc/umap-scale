# Controlled synthetic test on a small CPU machine (Adam optimizer).
# Known intrinsic dimension d x size n, independently varied; 3 realizations
# (new random geometry and sample each). Budget 0 records the initial layout so the
# loss-based target (95% of the loss reduction from init to 500 epochs) can be computed.
output: results/raw/synthetic_local.jsonl
datasets:
  - {name: "synthetic:2:50:0",  sizes: [2500, 5000, 10000, 20000, 40000]}
  - {name: "synthetic:4:50:0",  sizes: [2500, 5000, 10000, 20000, 40000]}
  - {name: "synthetic:8:50:0",  sizes: [2500, 5000, 10000, 20000, 40000]}
  - {name: "synthetic:12:50:0", sizes: [2500, 5000, 10000, 20000, 40000]}
  - {name: "synthetic:16:50:0", sizes: [2500, 5000, 10000, 20000, 40000]}
  - {name: "synthetic:24:50:0", sizes: [2500, 5000, 10000, 20000, 40000]}
  - {name: "synthetic:2:50:1",  sizes: [2500, 5000, 10000, 20000, 40000]}
  - {name: "synthetic:4:50:1",  sizes: [2500, 5000, 10000, 20000, 40000]}
  - {name: "synthetic:8:50:1",  sizes: [2500, 5000, 10000, 20000, 40000]}
  - {name: "synthetic:12:50:1", sizes: [2500, 5000, 10000, 20000, 40000]}
  - {name: "synthetic:16:50:1", sizes: [2500, 5000, 10000, 20000, 40000]}
  - {name: "synthetic:24:50:1", sizes: [2500, 5000, 10000, 20000, 40000]}
  - {name: "synthetic:2:50:2",  sizes: [2500, 5000, 10000, 20000, 40000]}
  - {name: "synthetic:4:50:2",  sizes: [2500, 5000, 10000, 20000, 40000]}
  - {name: "synthetic:8:50:2",  sizes: [2500, 5000, 10000, 20000, 40000]}
  - {name: "synthetic:12:50:2", sizes: [2500, 5000, 10000, 20000, 40000]}
  - {name: "synthetic:16:50:2", sizes: [2500, 5000, 10000, 20000, 40000]}
  - {name: "synthetic:24:50:2", sizes: [2500, 5000, 10000, 20000, 40000]}
optimizers: [adam]
budgets: [0, 5, 10, 15, 25, 35, 50, 70, 100, 140, 200, 300, 500]
seeds: [42]
knn_backend: umap
knn_accuracy: false
umap_loss: true
