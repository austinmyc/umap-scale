# Reproduces the development measurements the frozen laws were fitted on (one seed),
# now with 3 seeds. CPU only; roughly 3-4 hours on 8 cores.
output: results/raw/dev_reproduce.jsonl
datasets:
  - {name: fashion_mnist, sizes: [5000, 10000, 20000, 40000, 70000]}
  - {name: mnist,         sizes: [5000, 10000, 20000, 40000, 70000]}
  - {name: letter,        sizes: [2500, 5000, 10000, 20000]}
  - {name: pendigits,     sizes: [1375, 2750, 5500, 10992]}
optimizers: [adam, compatibility]
budgets: [5, 10, 25, 50, 100, 200, 500]
seeds: [42, 7, 123]
knn_backend: umap
